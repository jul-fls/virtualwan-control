services:
  control:
    environment:
      VWAN_PUBLIC_URL: https://${VWAN_CONTROL_HOST:?Set the management hostname}
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${VWAN_HTTPS_BIND_ADDRESS:-127.0.0.1}:443:443"
    environment:
      VWAN_CONTROL_HOST: ${VWAN_CONTROL_HOST:?Set the management hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [control]
volumes:
  caddy-data:
  caddy-config:
